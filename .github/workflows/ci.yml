name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: void_ci
          POSTGRES_PASSWORD: void_ci_ephemeral_only
          POSTGRES_DB: void_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U void_ci -d void_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.11'
          python-version: '3.11'
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen --group dev
        working-directory: services/knowledge
      - run: npm run typecheck
      - run: npm test
      - run: uv run --frozen pytest
        working-directory: services/knowledge
        env:
          # Public credentials for this disposable CI service; never production secrets.
          TEST_POSTGRES_URL: postgresql://void_ci:void_ci_ephemeral_only@127.0.0.1:5432/void_ci
      - run: python -m unittest discover -s eval -p 'test_*.py' -v
      - run: python -m unittest discover -s scripts -p 'test_catalog_*.py' -v
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # GitHub's Ubuntu runner already supplies Chromium's native libraries.
      # Keep Playwright's dependency validation and browser tests enabled,
      # without reinstalling optional fonts through the runner's apt mirror.
      - run: npx playwright install chromium
        working-directory: apps/web
      - name: Install pinned Chinese font for browser rendering
        run: |
          font_path="$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          mkdir -p "$(dirname "$font_path")"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
            --output "$font_path"
          printf '%s  %s\n' 2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b "$font_path" | sha256sum --check
          fc-cache --force "$HOME/.local/share/fonts"
          fc-match ':lang=zh-cn' | grep -F 'NotoSansCJKsc-Regular.otf'
      - run: npm run test:e2e --workspace @void-terminal/web -- --max-failures=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            artifacts/playwright-report/
            artifacts/playwright-results/
            artifacts/screenshots/
          if-no-files-found: ignore
