name: void-terminal
x-knowledge-environment: &knowledge-environment
  ENVIRONMENT: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-void}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-void}
  KNOWLEDGE_API_TOKEN: ${KNOWLEDGE_API_TOKEN:?Set KNOWLEDGE_API_TOKEN in .env}
  SHARED_DAILY_TOKEN_BUDGET: ${SHARED_DAILY_TOKEN_BUDGET:-0}
  EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
  EMBEDDING_MANIFEST: /app/models/embedding-manifest.json
  HF_HOME: /app/models/huggingface
  SENTENCE_TRANSFORMERS_HOME: /app/models/sentence-transformers
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-void}
      POSTGRES_USER: ${POSTGRES_USER:-void}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  knowledge:
    build:
      context: .
      dockerfile: deploy/Dockerfile.knowledge
      args:
        INSTALL_SEMANTIC: ${KNOWLEDGE_SEMANTIC_BUILD:-false}
    # Compose hosted deployments must opt into a finite monthly cap explicitly.
    command:
      - sh
      - -ec
      - |
        if [ "$${DEPLOYMENT_MODE}" = hosted ]; then
          case "$${SHARED_MONTHLY_TOKEN_BUDGET}" in
            ''|*[!0-9]*) echo "Hosted Compose requires a positive SHARED_MONTHLY_TOKEN_BUDGET" >&2; exit 1 ;;
            *[1-9]*) ;;
            *) echo "Hosted Compose requires a positive SHARED_MONTHLY_TOKEN_BUDGET" >&2; exit 1 ;;
          esac
        fi
        exec uvicorn knowledge.app:app --host 0.0.0.0 --port 8000
    environment:
      <<: *knowledge-environment
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE-self-hosted}
      SHARED_MONTHLY_TOKEN_BUDGET: ${SHARED_MONTHLY_TOKEN_BUDGET:-0}
      ACCOUNT_TRIAL_ENABLED: ${ACCOUNT_TRIAL_ENABLED:-false}
      ACCOUNT_DATABASE_PATH: /accounts/accounts.sqlite
      ACCOUNT_TRIAL_CREDITS: ${ACCOUNT_TRIAL_CREDITS:-20}
      ACCOUNT_RISK_SEND_DEVICE_LIMIT: ${ACCOUNT_RISK_SEND_DEVICE_LIMIT:-6}
      ACCOUNT_RISK_SEND_NETWORK_LIMIT: ${ACCOUNT_RISK_SEND_NETWORK_LIMIT:-24}
      ACCOUNT_RISK_SEND_FINGERPRINT_LIMIT: ${ACCOUNT_RISK_SEND_FINGERPRINT_LIMIT:-12}
      ACCOUNT_RISK_VERIFY_DEVICE_LIMIT: ${ACCOUNT_RISK_VERIFY_DEVICE_LIMIT:-20}
      ACCOUNT_RISK_VERIFY_NETWORK_LIMIT: ${ACCOUNT_RISK_VERIFY_NETWORK_LIMIT:-60}
      ACCOUNT_RISK_VERIFY_FINGERPRINT_LIMIT: ${ACCOUNT_RISK_VERIFY_FINGERPRINT_LIMIT:-30}
      ACCOUNT_RISK_REQUEST_DEVICE_LIMIT: ${ACCOUNT_RISK_REQUEST_DEVICE_LIMIT:-20}
      ACCOUNT_RISK_REQUEST_NETWORK_LIMIT: ${ACCOUNT_RISK_REQUEST_NETWORK_LIMIT:-50}
      ACCOUNT_RISK_REQUEST_FINGERPRINT_LIMIT: ${ACCOUNT_RISK_REQUEST_FINGERPRINT_LIMIT:-30}
    volumes:
      - accounts:/accounts
      - sources:/data/sources
      - models:/app/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import os,urllib.request; r=urllib.request.Request("http://127.0.0.1:8000/v1/status",headers={"X-Knowledge-Token":os.environ["KNOWLEDGE_API_TOKEN"]}); urllib.request.urlopen(r,timeout=5)']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE-self-hosted}
      KNOWLEDGE_URL: http://knowledge:8000
      KNOWLEDGE_API_TOKEN: ${KNOWLEDGE_API_TOKEN:?Set KNOWLEDGE_API_TOKEN in .env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_ALLOWED_BASE_URLS: ${DEEPSEEK_ALLOWED_BASE_URLS:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SHARED_MODE_ENABLED: ${SHARED_MODE_ENABLED:-false}
      ACCOUNT_TRIAL_ENABLED: ${ACCOUNT_TRIAL_ENABLED:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      TRIAL_ALLOWED_EMAILS: ${TRIAL_ALLOWED_EMAILS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ACCOUNT_RISK_SECRET: ${ACCOUNT_RISK_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SUPPORT_CONTACT_EMAIL: ${SUPPORT_CONTACT_EMAIL:-}
      SUPPORT_WECHAT_QR_URL: ${SUPPORT_WECHAT_QR_URL:-}
      SUPPORT_ALIPAY_QR_URL: ${SUPPORT_ALIPAY_QR_URL:-}
      SUPPORT_AFDIAN_URL: ${SUPPORT_AFDIAN_URL:-}
      SUPPORT_KOFI_URL: ${SUPPORT_KOFI_URL:-}
      SUPPORT_BSC_ADDRESS: ${SUPPORT_BSC_ADDRESS:-}
      SUPPORT_BSC_ASSETS: ${SUPPORT_BSC_ASSETS:-}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      knowledge:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/status").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 12
    restart: unless-stopped
  ingest:
    profiles: [ingest]
    build:
      context: .
      dockerfile: deploy/Dockerfile.knowledge
      args:
        INSTALL_SEMANTIC: ${KNOWLEDGE_SEMANTIC_BUILD:-false}
    environment: *knowledge-environment
    volumes:
      - sources:/data/sources
      - models:/app/models
    depends_on:
      db:
        condition: service_healthy
    entrypoint: [python, -m, knowledge.ingest]
    command: [--help]
volumes:
  accounts:
  database:
  sources:
  models:
