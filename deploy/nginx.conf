# Install in the TLS host's nginx http {} configuration after replacing domain and cert paths.
limit_req_zone $binary_remote_addr zone=void_requests:10m rate=30r/m;
server {
    listen 80;
    server_name void.example.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name void.example.com;
    ssl_certificate /etc/letsencrypt/live/void.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/void.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite supplied addresses; the app trusts only this controlled proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no always;
        limit_req zone=void_requests burst=20 nodelay;
    }
}
