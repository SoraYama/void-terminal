[project]
name = "void-knowledge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
